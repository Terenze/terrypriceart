<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terry Price Art</title>
  <meta name="description" content="Terry Price Art — Original paintings and limited edition prints." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ========================= -->
  <!-- COOKIE BANNER START -->
  <!-- ========================= -->
  <div id="cookie-banner" class="cookie-banner-top" hidden>
    <div class="cookie-inner">
      <p class="cookie-text">
        We use cookies to keep this site working, and (if you choose) to measure usage and improve it.
        <a class="cookie-link" href="/cookies.html">Cookie policy</a>
      </p>
      <div class="cookie-actions">
        <button class="btn btn-secondary" id="cookie-settings-btn" type="button" aria-expanded="false" aria-controls="cookie-settings">Settings</button>
        <button class="btn btn-secondary" id="cookie-reject-btn" type="button">Reject</button>
        <button class="btn" id="cookie-accept-btn" type="button">Accept</button>
      </div>
    </div>

    <div id="cookie-settings" class="cookie-settings" hidden>
      <div class="cookie-settings-inner">
        <label class="cookie-option">
          <input type="checkbox" checked disabled>
          Strictly necessary (always on)
        </label>
        <label class="cookie-option">
          <input id="cookie-analytics" type="checkbox">
          Analytics
        </label>
        <label class="cookie-option">
          <input id="cookie-marketing" type="checkbox">
          Marketing (not currently used)
        </label>
        <div class="cookie-actions">
          <button class="btn btn-secondary" id="cookie-cancel-btn" type="button">Cancel</button>
          <button class="btn" id="cookie-save-btn" type="button">Save choices</button>
        </div>
      </div>
    </div>
  </div>
  <!-- ========================= -->
  <!-- COOKIE BANNER END -->
  <!-- ========================= -->

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="/">Terry Price Art</a>
    </nav>
  </header>

  <main id="main" class="container" style="text-align:center; padding: 6rem 1rem;">
   
   <div class="placeholder-image">

    <img src="images/lion.jpg" alt="lion's head in soft pastel">
   </div>
   
    <h1>Coming soon</h1>
    <p style="max-width: 40rem; margin: 1rem auto; color: var(--muted);">
      A new collection of original paintings and limited edition prints is in preparation.
    </p>
    <p style="margin-top: 2rem;">
      Please check back soon.
    </p>
  </main>

        <a href="/contact.html">Contact</a> ·
        <a href="/cookies.html">Cookies</a>
      </p>
    </div>
  </footer>
-->
  <script src="js/main.js"></script>
</body>
</html>
